name: Windows portable beta bundle
on:
  pull_request:
    paths:
      - 'server.js'
      - 'contributor.js'
      - 'lan.js'
      - 'push.js'
      - 'uploads.js'
      - 'public/**'
      - 'test/**'
      - 'scripts/**'
      - 'docs/**'
      - 'package*.json'
      - '.github/workflows/beta-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-beta:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Credential-free unit and regression tests
        run: npm test
      - name: Parse Windows onboarding script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/windows/setup-user.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows/setup-user.ps1 -Action Doctor -Json
          if ($LASTEXITCODE -ne 0) { throw 'Windows diagnostic failed' }
      - name: Produce allowlisted source bundle
        run: npm run package:windows
      - name: Check release archive content
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Join-Path $PWD 'dist-packages/muse-remote-windows-beta.zip'))
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\','/') })
            foreach ($needed in @('package.json','server.js','scripts/windows/01_Instalar.cmd','scripts/windows/02_Iniciar_PWA.cmd','MANIFEST.json')) {
              if ($names -notcontains "muse-remote-windows/$needed") { throw "Missing $needed" }
            }
            if (@($names | Where-Object { $_ -match '/(\.token|\.lan\.pfx|\.vapid\.json|\.env|node_modules/)' }).Count -gt 0) {
              throw 'Unexpected runtime file in archive'
            }
          } finally { $zip.Dispose() }
      - uses: actions/upload-artifact@v7
        with:
          name: muse-remote-windows-beta
          path: dist-packages/muse-remote-windows-beta.zip
          if-no-files-found: error
          retention-days: 14
