name: Muse Remote KMP
on:
  push:
    branches: [feat/kmp-compose-native]
    paths:
      - 'native/**'
      - '.github/workflows/kmp-native.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/kmp-native.yml'
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Kotlin shared tests and Desktop
        run: gradle -p native :shared:desktopTest :desktopApp:compileKotlin
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK 36
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Android debug build
        run: gradle -p native :androidApp:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: muse-remote-debug
          path: native/androidApp/build/outputs/apk/debug/*.apk
